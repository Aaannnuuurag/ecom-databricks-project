resources:
  jobs:
    ecom_pipeline:
      name: ecom_pipeline_${bundle.target}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/bronze/01_bronze_ingestion
            base_parameters:
              catalog: ${var.catalog}
              schema: bronze

        - task_key: silver_processing
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/silver/02_silver_processing
            base_parameters:
              catalog: ${var.catalog}
              src_schema: bronze
              tgt_schema: silver

        - task_key: gold_modeling
          depends_on:
            - task_key: silver_processing
          notebook_task:
            notebook_path: ../src/gold/03_gold_modeling
            base_parameters:
              catalog: ${var.catalog}
              src_schema: silver
              tgt_schema: gold

        - task_key: spark_optimization
          depends_on:
            - task_key: gold_modeling
          notebook_task:
            notebook_path: ../src/04_spark_optimization
            base_parameters:
              catalog: ${var.catalog}

        - task_key: delta_optimization
          depends_on:
            - task_key: spark_optimization
          notebook_task:
            notebook_path: ../src/05_delta_optimization
            base_parameters:
              catalog: ${var.catalog}